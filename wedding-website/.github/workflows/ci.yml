name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate guest content
        run: npm run guests:check
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
